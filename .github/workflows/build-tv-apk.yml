name: Build Android TV APK

on: workflow_dispatch

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: '17'

  - name: Prepare Game Files
    run: |
      mkdir www
      rsync -av --exclude='www' --exclude='.git' --exclude='.github' ./ www/

  - name: Install Capacitor & Android Support
    run: |
      npm init -y
      npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
      npx cap init "Neon Grand Prix" "com.skyeprobably.neongp" --web-dir "www"
      npx cap add android

  - name: Inject Android TV (Leanback) Flags
    run: |
      cd android/app/src/main
      sed -i 's/<application/<uses-feature android:name="android.software.leanback" android:required="true" \/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" \/>\n    <application/g' AndroidManifest.xml
      sed -i 's/<category android:name="android.intent.category.LAUNCHER" \/>/<category android:name="android.intent.category.LAUNCHER" \/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" \/>/g' AndroidManifest.xml

  - name: Compile the APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK for Download
    uses: actions/upload-artifact@v4
    with:
      name: Neon-Grand-Prix-AndroidTV
      path: android/app/build/outputs/apk/debug/app-debug.apk
